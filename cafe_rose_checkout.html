<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ثبت سفارش | کافه رز</title>
<style>
:root{--ink:#2e211d;--cream:#fff9f2;--rose:#b65d68;--green:#526b50;--line:#eadfd4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.top{background:#2f241f;color:#fff0e4;padding:14px 20px;text-align:center}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.back{display:inline-block;margin-bottom:20px;color:#79564c;font-size:14px}.title{margin-bottom:22px}.title h1{margin:0 0 8px;font-size:30px}.title p{color:#856f64;line-height:1.8;margin:0}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:24px}.card h2{margin:0 0 20px;font-size:21px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#6e574e}.field input,.field textarea{width:100%;padding:13px 14px;border:1px solid #e6d8cc;border-radius:12px;background:#fffdfb;outline:none}.field input:focus,.field textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px #b65d681c}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:999px;padding:13px 18px;cursor:pointer;font:inherit;font-weight:700}.btn-rose{background:var(--rose);color:white}.btn-dark{background:var(--ink);color:white}.submit{width:100%;margin-top:18px}.order-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.emoji{width:50px;height:50px;border-radius:14px;background:#f3e2dc;display:grid;place-items:center;font-size:26px}.item-info{flex:1}.item-info b{font-size:14px}.item-info small{display:block;color:#8c766b;margin-top:6px}.summary-line{display:flex;justify-content:space-between;gap:15px;margin:16px 0;font-size:14px}.summary-line.total{border-top:1px solid var(--line);padding-top:16px;font-size:17px;font-weight:800}.notice{margin-top:14px;padding:13px;border-radius:12px;background:#edf1e8;color:#526b50;font-size:12px;line-height:1.8}.empty{text-align:center;line-height:2;color:#806b61;padding:25px}.success{display:none;margin-top:16px;padding:15px;background:#edf1e8;color:#405a3e;border-radius:12px;line-height:1.9;font-size:13px}@media(max-width:750px){.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.title h1{font-size:25px}}
</style></head><body>
<div class="top">🌹 کافه رز | ثبت سفارش قهوه و گل</div>
<main class="wrap"><a class="back" href="cafe_rose_store.html">← بازگشت به فروشگاه</a><div class="title"><h1>ثبت سفارش شما</h1><p>اطلاعاتت رو وارد کن تا سفارش قهوه و گل‌هات آماده بشه.</p></div>
<div class="layout"><section class="card"><h2>اطلاعات مشتری</h2><form id="orderForm"><div class="fields">
<div class="field"><label for="first">نام</label><input id="first" name="first" required placeholder="نام شما"></div>
<div class="field"><label for="last">نام خانوادگی</label><input id="last" name="last" required placeholder="نام خانوادگی شما"></div>
<div class="field"><label for="phone">شماره تماس</label><input id="phone" name="phone" type="tel" required placeholder="مثلاً 09xxxxxxxxx"></div>
<div class="field"><label for="email">ایمیل (اختیاری)</label><input id="email" name="email" type="email" placeholder="name@example.com"></div>
<div class="field full"><label for="address">آدرس کامل</label><textarea id="address" name="address" required placeholder="استان، شهر، خیابان، پلاک و واحد"></textarea></div>
<div class="field full"><label for="note">توضیحات سفارش (اختیاری)</label><textarea id="note" name="note" placeholder="مثلاً متن کارت هدیه یا زمان پیشنهادی تحویل"></textarea></div>
</div><button class="btn btn-rose submit" type="submit">ثبت نهایی سفارش</button><div class="success" id="success"></div></form></section>
<aside class="card"><h2>خلاصه سفارش</h2><div id="items"></div><div class="summary-line total"><span>مبلغ کل</span><span id="total">۰ تومان</span></div><div class="notice">این نسخه نمایشی است؛ برای دریافت واقعی سفارش‌ها باید سایت به سرویس ارسال سفارش یا پنل فروشنده متصل شود.</div></aside></div></main>
<script>
const products=[{id:1,name:'لاته رز',price:145000,emoji:'☕'},{id:2,name:'آمریکانو کلاسیک',price:110000,emoji:'🫖'},{id:3,name:'کاپوچینو',price:135000,emoji:'🥛'},{id:4,name:'دسته‌گل رز قرمز',price:780000,emoji:'💐'},{id:5,name:'دسته‌گل رز صورتی',price:690000,emoji:'🌷'},{id:6,name:'رز سفید',price:720000,emoji:'🤍'},{id:7,name:'باکس قهوه و رز',price:950000,emoji:'🎁'},{id:8,name:'باکس سورپرایز رز',price:1250000,emoji:'🌹'}];
let cart=JSON.parse(localStorage.getItem('cafeRoseCart')||'[]');const fmt=n=>new Intl.NumberFormat('fa-IR').format(n);
function render(){const box=document.getElementById('items');if(!cart.length){box.innerHTML='<div class="empty">سبد خرید خالی است.<br><a class="btn btn-dark" href="cafe_rose_store.html">رفتن به فروشگاه</a></div>';document.getElementById('total').textContent='۰ تومان';return}
let total=0;box.innerHTML=cart.map(x=>{const p=products.find(p=>p.id===x.id);if(!p)return '';total+=p.price*x.qty;return `<div class="order-item"><div class="emoji">${p.emoji}</div><div class="item-info"><b>${p.name}</b><small>تعداد: ${fmt(x.qty)} × ${fmt(p.price)} تومان</small></div><strong>${fmt(p.price*x.qty)} تومان</strong></div>`}).join('');document.getElementById('total').textContent=fmt(total)+' تومان'}
document.getElementById('orderForm').addEventListener('submit',e=>{e.preventDefault();if(!cart.length){alert('سبد خرید خالی است.');return}const f=new FormData(e.target);const order={customer:{first:f.get('first'),last:f.get('last'),phone:f.get('phone'),email:f.get('email'),address:f.get('address'),note:f.get('note')},items:cart,total:cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0)};document.getElementById('success').style.display='block';document.getElementById('success').innerHTML='سفارش شما در این پیش‌نمایش ثبت شد، '+order.customer.first+' عزیز 🌹<br>مبلغ سفارش: '+fmt(order.total)+' تومان<br>برای ارسال سفارش واقعی، لازم است سایت به سیستم ثبت سفارش متصل شود.';localStorage.setItem('cafeRoseLastOrder',JSON.stringify(order));});
render();
</script></body></html>
